<!DOCTYPE html>
<html>

<head>
  <base href="/sihamAbd_portfolio/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Siham Abdullah - Flutter Developer Portfolio">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="purple_portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Siham Abdullah | Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(135deg, #0A0710 0%, #130B1D 50%, #07050A 100%);
      background-size: 100% 100%;
    }

    .splash-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .splash-logo {
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-size: 48px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #9C27B0, #E1BEE7, #9C27B0);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 2s ease-in-out infinite, pulse 1.5s ease-in-out infinite;
    }

    .splash-ring {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      border: 3px solid transparent;
      border-top-color: #9C27B0;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      position: relative;
    }

    .splash-ring::before {
      content: '';
      position: absolute;
      top: 5px;
      left: 5px;
      right: 5px;
      bottom: 5px;
      border: 3px solid transparent;
      border-top-color: #E1BEE7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite reverse;
    }

    .splash-ring::after {
      content: '';
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      bottom: 15px;
      border: 3px solid transparent;
      border-top-color: #CE93D8;
      border-radius: 50%;
      animation: spin 1.2s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes gradient-shift {

      0%,
      100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.05);
        opacity: 0.8;
      }
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }
  </style>
  <script>
    function removeSplashFromWeb() {
      document.getElementById("splash-loader")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>

<body>
  <div id="splash-loader" class="splash-loader">
    <div class="splash-ring"></div>
    <div class="splash-logo">SA.</div>
  </div>
  <script src="flutter_bootstrap.js" async=""></script>
</body>

</html>
