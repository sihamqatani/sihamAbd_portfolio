name: purple_portfolio
description: A modern, glassmorphism-style portfolio for a Flutter developer.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Navigation
  go_router: ^13.0.0
  
  # UI & Design
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  font_awesome_flutter: ^10.6.0
  animated_theme_switcher: 
  glass_kit: ^3.0.0 # Optional, but we can implement custom too. Let's use custom for control, but keep generic deps.
  
  # Localization
  intl: 
  
  # Utils
  url_launcher: ^6.2.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.3.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/cv/Siham_Abdullah_Al-Qatani_Flutter_developer_CV.pdf
  
  generate: true # For localization code generation

flutter_native_splash:
  color: "#0A0710" # Dark background matching app theme
  color_dark: "#0A0710" # Same for dark mode
  android: true
  ios: true
  web: true
